name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: Lint
        run: ruff check .

      - name: Train the model
        run: cosmoquake train --trees 100

      - name: Test
        run: pytest -q --cov=cosmoquake --cov-report=term-missing

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and train
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          cosmoquake train --trees 100 --no-eval

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cosmoquake:ci

      - name: Smoke-test the container
        run: |
          docker run -d --name cosmoquake -p 8000:8000 cosmoquake:ci
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "service is up"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "service did not start in time"
              docker logs cosmoquake
              exit 1
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q '"model_loaded":true'
          docker rm -f cosmoquake
