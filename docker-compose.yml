# Local run:  docker compose up --build  ->  http://localhost:8000
services:
  analyzer:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Cap uploads; one hour of 20 Hz InSight data is about 4 MB as CSV.
      COSMOQUAKE_MAX_UPLOAD_MB: "64"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
